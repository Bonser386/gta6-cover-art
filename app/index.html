<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA 6-style cover art maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <h1>VICE COVER STUDIO</h1>
  <p>Turn your photos into GTA-style cover art. Everything runs offline — photos never leave your machine.</p>
</header>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <div class="group">
      <h2>Layout</h2>
      <div class="row" id="layoutRow">
        <button type="button" data-layout="hero" class="active">Hero + two</button>
        <button type="button" data-layout="strips">Three strips</button>
        <button type="button" data-layout="grid">Four grid</button>
        <button type="button" data-layout="fullbleed">Full bleed</button>
      </div>
    </div>
    <div class="group">
      <h2>Size</h2>
      <div class="row" id="sizeRow">
        <button type="button" data-size="1080x1080" class="active">1080 × 1080</button>
        <button type="button" data-size="1080x1350">1080 × 1350</button>
        <button type="button" data-size="1920x1080">1920 × 1080</button>
      </div>
    </div>
    <div class="group">
      <h2>Grade</h2>
      <div class="row" id="gradeRow">
        <button type="button" data-grade="sunset" class="active">Sunset</button>
        <button type="button" data-grade="neon">Neon</button>
        <button type="button" data-grade="midnight">Midnight</button>
      </div>
    </div>
    <div class="group">
      <h2>Caption</h2>
      <label>Title <input id="title" type="text" maxlength="40" value="Neon Shores"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="VICE CITY"></label>
    </div>
    <div class="group">
      <h2>Photos</h2>
      <label class="drop" id="drop">Drop photos here or choose files
        <input id="photo" type="file" accept="image/*" multiple>
      </label>
      <div class="samples" id="samples"></div>
      <p class="hint">Click a panel in the preview to select it, then click a sample to fill it. Drag a panel to pan, scroll to zoom.</p>
      <div class="row">
        <label class="zoom">Zoom <input id="zoom" type="range" min="100" max="300" value="100"></label>
        <button id="fit" type="button">Fit panel</button>
      </div>
      <p id="panelLabel" class="hint">Panel 1 selected</p>
    </div>
    <button id="export" type="button" class="export">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  <section class="preview" id="previewWrap">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
